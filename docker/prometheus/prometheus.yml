global:
  scrape_interval:     15s
  evaluation_interval: 5s
  scrape_timeout:      10s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'loadtest'
    scrape_interval: 2s
    static_configs:
      - targets: ['loadtest:8090']
