---
# Deploys nginx + node-exporter on the nginx VM.
# nginx proxies to the dedicated upstream VM at {{ upstream_nginx_ip }}:9000.

- name: Create nginx project directory
  file:
    path: "{{ nginx_dir }}"
    state: directory
    mode: '0755'

- name: Template docker-compose.yml (injects upstream_nginx_ip)
  template:
    src: docker-compose.yml.j2
    dest: "{{ nginx_dir }}/docker-compose.yml"

- name: Template nginx.conf (tuned worker/fd/keepalive settings)
  template:
    src: nginx.conf.j2
    dest: "{{ nginx_dir }}/nginx.conf"

- name: Template nginx proxy.conf (upstream IP injected)
  template:
    src: proxy.conf.j2
    dest: "{{ nginx_dir }}/proxy.conf"

- name: Pull nginx and node-exporter images
  command: docker compose pull
  args:
    chdir: "{{ nginx_dir }}"
  ignore_errors: yes

- name: Stop any old nginx containers (free port 80)
  command: docker compose stop nginx
  args:
    chdir: "{{ nginx_dir }}"
  ignore_errors: yes
  changed_when: false

- name: Start nginx stack
  command: docker compose up -d
  args:
    chdir: "{{ nginx_dir }}"

- name: Show nginx VM containers
  command: docker compose ps
  args:
    chdir: "{{ nginx_dir }}"
  register: ps_out
  changed_when: false

- name: nginx VM status
  debug:
    msg: "{{ ps_out.stdout_lines }}"
