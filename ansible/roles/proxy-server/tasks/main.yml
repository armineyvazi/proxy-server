---
# ── Install Rust ──────────────────────────────────────────────────────────────
- name: Check if rustup is installed
  stat:
    path: /root/.cargo/bin/rustup
  register: rustup_bin

- name: Install Rust via rustup
  shell: |
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
  when: not rustup_bin.stat.exists

# ── Upload source ─────────────────────────────────────────────────────────────
- name: Create proxy-server source directory
  file:
    path: /opt/proxy-server/src
    state: directory
    mode: '0755'

- name: Copy Cargo.toml
  copy:
    src: "{{ playbook_dir }}/../Cargo.toml"
    dest: /opt/proxy-server/Cargo.toml
  register: cargo_toml

- name: Copy Cargo.lock
  copy:
    src: "{{ playbook_dir }}/../Cargo.lock"
    dest: /opt/proxy-server/Cargo.lock
  register: cargo_lock

- name: Copy src directory
  copy:
    src: "{{ playbook_dir }}/../src/"
    dest: /opt/proxy-server/src/
  register: src_files

# ── Build ─────────────────────────────────────────────────────────────────────
- name: Check if binary already exists
  stat:
    path: /usr/local/bin/proxy-server
  register: proxy_bin

- name: Build proxy-server --release
  # Runs only when source changed OR binary is missing (first deploy).
  # Subsequent runs with no code changes skip this ~2 min step.
  command: /root/.cargo/bin/cargo build --release
  args:
    chdir: /opt/proxy-server
  when: cargo_toml.changed or cargo_lock.changed or src_files.changed or not proxy_bin.stat.exists
  register: build_result

- name: Install proxy-server binary
  copy:
    src: /opt/proxy-server/target/release/proxy-server
    dest: /usr/local/bin/proxy-server
    mode: '0755'
    remote_src: yes
  when: build_result is changed

# ── systemd service ───────────────────────────────────────────────────────────
- name: Install proxy-server systemd service
  template:
    src: proxy-server.service.j2
    dest: /etc/systemd/system/proxy-server.service
  notify: restart proxy-server

- name: "{{ 'Start' if proxy_backend == 'proxy-server' else 'Stop' }} proxy-server"
  systemd:
    name: proxy-server
    state: "{{ 'started' if proxy_backend == 'proxy-server' else 'stopped' }}"
    enabled: "{{ proxy_backend == 'proxy-server' }}"
    daemon_reload: yes
